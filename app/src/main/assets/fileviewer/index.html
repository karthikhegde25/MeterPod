<style>
:root{--bg:#f4f6f9;--panel:#fff;--ink:#1b2430;--mute:#66707e;--line:#d9dee6;--acc:#2f5bd8;--accink:#fff;--err:#c23a3a;--ok:#2a7d4f;--code:#eef1f6}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--panel:#1a2029;--ink:#e6eaf0;--mute:#8d97a5;--line:#2c3542;--acc:#7c9cff;--accink:#10141b;--err:#ff8585;--ok:#6fd49b;--code:#222a35}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.mono,pre,textarea{font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:650}
button,.btn{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--acc)}
button.pri,.btn.pri{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
button:focus-visible,.btn:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:16px}
#drop{border:2px dashed var(--line);border-radius:10px;padding:40px 16px;text-align:center;color:var(--mute);background:var(--panel)}
#drop.over{border-color:var(--acc);color:var(--ink)}
#drop b{color:var(--ink);display:block;font-size:17px;margin-bottom:0}
#chips{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 0}
.chip{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
#viewer{margin-top:14px;display:none}
.head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;margin-bottom:8px}
.head .n{font-weight:650;word-break:break-all}.head .m{color:var(--mute);font-size:13px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:9px 14px}
.tab.on{border-bottom-color:var(--acc);font-weight:650}
.pane{background:var(--panel);border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;padding:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.bar .st{color:var(--mute);font-size:13px}.err{color:var(--err)}.ok{color:var(--ok)}
textarea{width:100%;min-height:55vh;resize:vertical;background:var(--code);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px;tab-size:2}
pre{margin:0;background:var(--code);border-radius:6px;padding:10px;overflow:auto;max-height:70vh;white-space:pre}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}th{background:var(--code)}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0}dt{color:var(--mute)}dd{margin:0;word-break:break-all}
img.pv,video,iframe{max-width:100%;border-radius:6px}iframe{width:100%;height:70vh;border:1px solid var(--line)}
.md h1,.md h2,.md h3{margin:.9em 0 .4em}.md code{background:var(--code);padding:1px 5px;border-radius:4px}.md pre code{padding:0}.md blockquote{margin:0;padding-left:12px;border-left:3px solid var(--line);color:var(--mute)}
.note{color:var(--mute);margin:0 0 10px;font-size:13px}
input[type=number]{width:110px;background:var(--code);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px}
.banner{display:none;align-items:flex-start;gap:10px;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.banner button{margin-left:auto;padding:2px 9px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
canvas.pg{display:block;max-width:100%;height:auto;margin:0 auto 10px;border:1px solid var(--line);background:#fff}
.dd{position:relative}.dd summary{list-style:none;cursor:pointer;display:inline-block}.dd summary::-webkit-details-marker{display:none}
.ddm{position:absolute;z-index:5;left:0;top:calc(100% + 4px);min-width:200px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px;display:flex;flex-direction:column;gap:2px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.ddm button{border:0;text-align:left;background:none}.ddm button:hover{background:var(--code)}
textarea.edp{min-height:2.4em;margin-bottom:8px;resize:none;overflow:hidden}
.xg td{padding:0}.xg th{position:sticky;top:0}.xg input{width:120px;border:0;padding:6px;background:transparent;color:var(--ink);font:inherit;font-size:13px}.xg input:disabled{color:var(--mute)}
.code{counter-reset:l;tab-size:4}
.code .l{display:block;counter-increment:l;padding-left:3.6em;position:relative;min-height:1.55em;white-space:pre}
.code .l::before{content:counter(l);position:absolute;left:0;width:3em;text-align:right;color:var(--mute)}
.tc{color:var(--mute);font-style:italic}.ts{color:#1a7f4b}.tn{color:#b45309}.tk{color:var(--acc);font-weight:600}.tg{color:var(--acc)}
.da{background:rgba(42,125,79,.2)}.dd{background:rgba(194,58,58,.2)}
@media (prefers-color-scheme:dark){.ts{color:#6fd49b}.tn{color:#f0b35a}}
header{justify-content:center;padding:0;border:0}
#drop{-webkit-user-select:none;user-select:none;cursor:pointer;-webkit-tap-highlight-color:transparent}#drop *{pointer-events:none}
#drop:hover,#drop:focus-visible{border-color:var(--acc);outline:none}
.cw{display:inline-flex;max-width:100%}.cw .chip{border-radius:6px 0 0 6px;border-right:0}.cw .x{border-radius:0 6px 6px 0;padding:7px 10px;line-height:1}.cw.on .x{border-color:var(--acc)}
#intro{margin-top:22px}#intro h1{font-size:22px;margin:0 0 4px;text-align:center}#intro .sub{text-align:center;color:var(--mute);margin:0 0 16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card h3{margin:0 0 4px;font-size:15px}.card p{margin:0;color:var(--mute);font-size:13.5px}

/* --- code / text / hex boxes: every line stays on one line; the box scrolls, with always-visible scrollbars --- */
#viewer,.pane{min-width:0;max-width:100%}
pre,textarea,.wrap{max-width:100%;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
pre{max-height:none;white-space:pre;overflow-wrap:normal;word-break:normal;border:1px solid var(--line)}
textarea{white-space:pre;overflow-wrap:normal;word-wrap:normal}
.code .l{white-space:pre}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:rgba(127,127,127,.18);border-radius:8px}
::-webkit-scrollbar-thumb{background:#7f9bd6;border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
.md{overflow-wrap:anywhere;min-width:0;max-width:100%}.md pre{display:block;max-width:100%;overflow:auto}.md img,.md table{max-width:100%}

/* scrolling + full-screen-height boxes (append) */
html,body{height:auto;min-height:100%;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}
pre,textarea,.wrap{overscroll-behavior:auto;touch-action:pan-x pan-y}
#viewer pre{height:var(--boxh,420px);min-height:320px;max-height:none;overflow:auto}
.md pre,.pane dl pre,.pane details pre{height:auto;min-height:0;max-height:60vh}
#viewer textarea:not(.edp){height:var(--boxh,420px);min-height:320px;resize:none;overflow:auto}
main{padding:10px}
</style>

<body>
<header>
  <input id="pick" type="file" multiple hidden>
</header>
<main>
  <div id="dm" class="banner" role="note"><span>Tip: for the best layout on a phone, open this page in desktop site mode (browser menu, then "Desktop site") and reload.</span><button id="dmx" aria-label="Dismiss">✕</button></div>
  <div id="drop" role="button" tabindex="0" aria-label="Click here to drop files"><b>Click here to drop files</b></div>
  <div id="chips"></div>
  <section id="intro" hidden></section>
  <section id="viewer">
    <div class="head"><div class="n" id="fname"></div><div class="m" id="fmeta"></div></div>
    <div class="acts" id="acts"></div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="pane" id="pane"></div>
  </section>
</main>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const files=[];let cur=null;
const MAG=[[[0x89,0x50,0x4e,0x47],'PNG image','image'],[[0xff,0xd8,0xff],'JPEG image','image'],[[0x47,0x49,0x46,0x38],'GIF image','image'],
[[0x25,0x50,0x44,0x46],'PDF document','pdf'],[[0x50,0x4b,3,4],'ZIP container (APK, JAR, DOCX, XLSX…)','bin'],[[0x1f,0x8b],'GZIP archive','bin'],
[[0xfe,0xed,0xfe,0xed],'Java KeyStore (JKS)','jks'],[[0xce,0xce,0xce,0xce],'Java KeyStore (JCEKS)','bin'],[[0x7f,0x45,0x4c,0x46],'ELF binary','bin'],
[[0xca,0xfe,0xba,0xbe],'Java class / Mach-O universal','bin'],[[0x37,0x7a,0xbc,0xaf],'7-Zip archive','bin'],[[0x52,0x61,0x72,0x21],'RAR archive','bin'],
[[0x53,0x51,0x4c,0x69],'SQLite database','bin'],[[0x64,0x65,0x78,0x0a],'Android DEX','bin'],[[0x49,0x44,0x33],'MP3 audio','audio'],
[[0x4f,0x67,0x67,0x53],'Ogg media','audio'],[[0x00,0x61,0x73,0x6d],'WebAssembly module','bin']];
const EXT={png:['image','image/png'],jpg:['image','image/jpeg'],jpeg:['image','image/jpeg'],gif:['image','image/gif'],webp:['image','image/webp'],bmp:['image','image/bmp'],ico:['image','image/x-icon'],svg:['image','image/svg+xml'],
mp3:['audio','audio/mpeg'],wav:['audio','audio/wav'],ogg:['audio','audio/ogg'],m4a:['audio','audio/mp4'],flac:['audio','audio/flac'],mp4:['video','video/mp4'],webm:['video','video/webm'],mov:['video','video/quicktime'],pdf:['pdf','application/pdf'],
json:['json'],xml:['xml'],plist:['xml'],xsd:['xml'],md:['md'],markdown:['md'],csv:['csv'],tsv:['csv'],jks:['jks'],p12:['p12'],pfx:['p12']};
const hex2=n=>n.toString(16).padStart(2,'0');
const fmtSize=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB';

function analyze(f){
  const b=f.bytes,ext=(f.name.split('.').pop()||'').toLowerCase();let label='',kind='';
  for(const [m,l,k] of MAG){if(m.every((x,i)=>b[i]===x)){label=l;kind=k;break}}
  if(!kind&&b.length>12){const s=String.fromCharCode(...b.subarray(0,12));
    if(s.startsWith('RIFF')&&s.slice(8,12)==='WEBP'){label='WebP image';kind='image'}
    else if(s.startsWith('RIFF')&&s.slice(8,12)==='WAVE'){label='WAV audio';kind='audio'}
    else if(s.slice(4,8)==='ftyp'){label='MP4/MOV video';kind='video'}}
  const e=EXT[ext];
  if(!kind&&e&&['image','audio','video','pdf'].includes(e[0])){kind=e[0];label=label||ext.toUpperCase()+' file'}
  f.mime=(e&&e[1])||f.type||'application/octet-stream';
  if(!kind&&isPfx(b)){kind='p12';label='PKCS#12 keystore (PFX)'}
  // text detection
  let text=null;
  if(!['jks','p12','bin','image','audio','video','pdf'].includes(kind)||ext==='svg'){
    const head=b.subarray(0,8192);const bom=b[0]===0xFF&&b[1]===0xFE?'utf-16le':b[0]===0xFE&&b[1]===0xFF?'utf-16be':'';let nul=head.includes(0)&&!bom;
    if(!nul||ext==='svg'){try{text=new TextDecoder(bom||'utf-8',{fatal:true}).decode(b)}catch(_){
      try{text=new TextDecoder('utf-8').decode(b);if((text.match(/\uFFFD/g)||[]).length>b.length*0.02)text=null}catch(_2){text=null}}}
  }
  f.isText=text!==null;f.text=text;f.orig=text;
  if(f.isText&&ext==='svg'){kind='image';label='SVG image'}
  if(!kind){
    if(f.isText){kind=(e&&['json','xml','md','csv'].includes(e[0]))?e[0]:'text';
      label=(kind==='text'&&LBL[fkey(f.name)])||{json:'JSON',xml:'XML',md:'Markdown',csv:'Delimited table',text:'Plain text'}[kind]}
    else{kind=ext==='p12'||ext==='pfx'?'bin':'bin';label=e&&e[0]==='p12'?'PKCS#12 keystore (binary)':'Binary data'}
  }
  if(kind==='jks'&&ext&&false){}
  f.kind=kind;f.label=label;f.hexOff=0;f.dirty=false;f.editing=false;
  f.special=['image','audio','video','pdf','json','xml','md','csv','jks','p12','text'].includes(kind);
  f.tab=f.special?'view':f.isText?'text':'hex';
  if(['image','audio','video','pdf'].includes(kind))f.url=URL.createObjectURL(new Blob([b],{type:f.mime}));
}

async function addFiles(list){
  for(const file of list){
    const f={name:file.name,size:file.size,mod:file.lastModified,type:file.type,bytes:new Uint8Array(await file.arrayBuffer())};
    analyze(f);await extra(f);files.push(f);cur=f;
  }
  draw();
}
$('#pick').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};
const drop=$('#drop');
['dragover','dragenter'].forEach(t=>addEventListener(t,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(t=>addEventListener(t,e=>{e.preventDefault();drop.classList.remove('over')}));
addEventListener('drop',e=>{if(e.dataTransfer&&e.dataTransfer.files.length)addFiles([...e.dataTransfer.files])});
drop.onclick=()=>$('#pick').click();
drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#pick').click()}};

function removeFile(f){const msg=(f.dirty?'"'+f.name+'" has unsaved edits. ':'')+'Remove "'+f.name+'" from the viewer?\n\nThis only closes it here. Your file on the device is not deleted.';
  if(!confirm(msg))return;const i=files.indexOf(f);files.splice(i,1);if(f.url)URL.revokeObjectURL(f.url);if(cur===f)cur=files[Math.min(i,files.length-1)]||null;draw()}
function draw(){
  const chips=$('#chips');chips.innerHTML='';$('#intro').style.display=files.length?'none':'';
  files.forEach(f=>{const w=document.createElement('span');w.className='cw'+(f===cur?' on':'');
    const b=document.createElement('button');b.className='chip'+(f===cur?' on':'');b.textContent=(f.dirty?'• ':'')+f.name;b.onclick=()=>{cur=f;draw()};
    const x=document.createElement('button');x.className='x';x.textContent='✕';x.setAttribute('aria-label','Remove '+f.name);x.onclick=()=>removeFile(f);
    w.appendChild(b);w.appendChild(x);chips.appendChild(w)});
  const v=$('#viewer');if(!cur){v.style.display='none';return}
  v.style.display='block';
  $('#fname').textContent=cur.name;$('#fmeta').textContent=cur.label+' · '+fmtSize(cur.size);drawActs();
  const tabs=[];if(cur.special)tabs.push(['view','View']);if(cur.isText)tabs.push(['text','Text']);tabs.push(['hex','Hex'],['str','Strings'],['info','Info']);
  const t=$('#tabs');t.innerHTML='';
  tabs.forEach(([id,name])=>{const b=document.createElement('button');b.className='tab'+(cur.tab===id?' on':'');b.setAttribute('role','tab');b.textContent=name;b.onclick=()=>{cur.tab=id;draw()};t.appendChild(b)});
  const pane=$('#pane');pane.innerHTML='';
  ({view:vView,text:vText,hex:vHex,str:vStr,info:vInfo})[cur.tab](pane);
  if(cur.note&&cur.tab==='view')pane.insertAdjacentHTML('afterbegin','<p class="note err">'+esc(cur.note)+'</p>');
}

async function dl(f){const blob=f.isText&&f.dirty?new Blob([f.text],{type:'text/plain'}):f.ed&&f.dirty?new Blob([await buildEdited(f)],{type:f.type||f.mime}):new Blob([f.bytes],{type:f.mime});
  saveBlob(blob,f.name)}
function saveBlob(blob,name){if(window.AndroidBridge&&AndroidBridge.save){const r=new FileReader();r.onload=()=>AndroidBridge.save(name,blob.type||'application/octet-stream',String(r.result).split(',')[1]||'');r.readAsDataURL(blob);return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function bar(pane,btns,status){const d=document.createElement('div');d.className='bar';
  btns.forEach(([l,fn,pri])=>{const b=document.createElement('button');b.textContent=l;if(pri)b.className='pri';b.onclick=fn;d.appendChild(b)});
  const s=document.createElement('span');s.className='st';d.appendChild(s);pane.appendChild(d);return s}

/* ---------- Text ---------- */
function fmtXml(s){const d=new DOMParser().parseFromString(s,'application/xml');const e=d.querySelector('parsererror');
  if(e)throw new Error(e.textContent.split('\n')[0]);
  const x=new XMLSerializer().serializeToString(d).replace(/>\s+</g,'><');let ind=0;
  return x.split(/(?<=>)(?=<)/).map(l=>{if(/^<\//.test(l))ind--;const o='  '.repeat(Math.max(ind,0))+l;
    if(/^<[^!?\/](?:[^>]*[^\/])?>$/.test(l)&&!/<\/[^>]+>$/.test(l))ind++;return o}).join('\n')}
function vText(pane){
  const f=cur,ro=!f.editing,btns=[];
  if(ro)btns.push(['Edit',()=>{f.editing=true;draw()},1]);
  else{
    if(f.kind==='json'){btns.push(['Format',()=>run(()=>JSON.stringify(JSON.parse(ta.value),null,2))],['Minify',()=>run(()=>JSON.stringify(JSON.parse(ta.value)))])}
    if(f.kind==='xml')btns.push(['Format',()=>run(()=>fmtXml(ta.value))]);
  }
  btns.push(['Copy',()=>{navigator.clipboard.writeText(ta.value).then(()=>msg('Copied',1),()=>msg('Copy blocked by the browser',0))}]);
  if(!ro)btns.push(['Save',()=>dl(f),1]);
  const st=bar(pane,btns,'');const ta=document.createElement('textarea');ta.spellcheck=false;ta.wrap='off';ta.value=f.text;ta.readOnly=ro;pane.appendChild(ta);
  function msg(t,ok){st.textContent=t;st.className='st '+(ok?'ok':'err')}
  if(ro)msg('Read-only. Press Edit to change this file.',1);
  function run(fn){try{ta.value=fn();upd();msg('Done',1)}catch(e){msg(e.message,0)}}
  function upd(){f.text=ta.value;f.dirty=true;f.size=new Blob([f.text]).size;drawActs()}
  ta.oninput=()=>{upd();st.textContent='Edited. Save downloads the changed file.';st.className='st'};
}
function revert(f){if(!f.dirty||!confirm('Discard all edits and restore the original file?'))return;
  if(f.ed){f.ed.dom=null;f.doc=f.doc0;f.dirty=false;f.size=f.bytes.length;(f.editing?prepEdit(f):Promise.resolve()).then(draw);return}
  f.text=f.orig;f.dirty=false;f.size=f.bytes.length;draw()}
function drawActs(){const a=$('#acts');a.innerHTML='';const f=cur;
  const add=(l,fn,pri)=>{const b=document.createElement('button');b.textContent=l;if(pri)b.className='pri';b.onclick=fn;a.appendChild(b)};
  if(f.isText||f.ed)add(f.editing?'Stop editing':'Edit',()=>toggleEdit(f),!f.editing);
  if(f.dirty)add('Revert to original',()=>revert(f));
  const wr=f.isText||f.doc,d=document.createElement('details');d.className='dd';d.innerHTML='<summary class="btn pri">Download ▾</summary><div class="ddm"></div>';
  [[wr?'Text (.txt)':'Report (.txt)',()=>saveAs(f,'txt')],[wr?'Markdown (.md)':'Report (.md)',()=>saveAs(f,'md')],[f.dirty?'Edited file':'Original file',()=>dl(f)]].forEach(([l,fn])=>{
    const b=document.createElement('button');b.textContent=l;b.onclick=()=>{d.open=false;fn()};d.querySelector('.ddm').appendChild(b)});
  a.appendChild(d)}
function saveAs(f,ext){const x=exportOf(f),base=f.name.replace(/\.[^.]+$/,'')||f.name;
  saveBlob(new Blob([ext==='md'?x.md:x.txt],{type:'text/plain;charset=utf-8'}),base+'.'+ext)}
function infoText(f){const b=f.bytes;return [`Name: ${f.name}`,`Type: ${f.label}`,`MIME: ${f.mime}`,`Size: ${f.size} bytes`,`Magic bytes: ${[...b.subarray(0,16)].map(hex2).join(' ')}`,`Entropy: ${entropy(b).toFixed(2)} / 8`,f.sha256?'SHA-256: '+f.sha256:''].filter(Boolean).join('\n')}
function csvRows(f,lim){const l=f.text.split('\n')[0];const d=/\.tsv$/i.test(f.name)?'\t':l.split(';').length>l.split(',').length?';':',';return parseCsv(f.text,d,lim)}
function exportOf(f){
  if(f.doc)return {txt:f.doc.txt,md:f.doc.md};
  if(f.isText){const t=f.text;let md;
    if(f.kind==='md')md=t;
    else if(f.kind==='csv'){const r=csvRows(f,Infinity).filter(x=>x.length);const c=s=>String(s).replace(/\|/g,'\\|').replace(/\r?\n/g,' ');
      md='# '+f.name+'\n\n'+(r.length?'| '+r[0].map(c).join(' | ')+' |\n|'+r[0].map(()=>' --- |').join('')+'\n'+r.slice(1).map(x=>'| '+x.map(c).join(' | ')+' |').join('\n'):'')+'\n'}
    else{const fe=t.includes('```')?'~~~~':'```';const lang={json:'json',xml:'xml'}[f.kind]||(f.name.split('.').pop()||'').toLowerCase().replace(/[^a-z0-9]/g,'');
      md='# '+f.name+'\n\n'+fe+lang+'\n'+t+'\n'+fe+'\n'}
    return {txt:t,md}}
  let body=f.report||'';if(!body&&!['jks','p12','pdf'].includes(f.kind))body='Strings:\n'+stringsOf(f.bytes,500).join('\n');
  const txt=infoText(f)+(body?'\n\n'+body:'');
  return {txt,md:'# Report: '+f.name+'\n\n```\n'+txt+'\n```\n'}}

/* ---------- View ---------- */
function mdRender(src){
  const blocks=[];src=src.replace(/```[^\n]*\n([\s\S]*?)```/g,(_,c)=>{blocks.push(c);return '\u0000'+(blocks.length-1)+'\u0000'});
  const inl=s=>esc(s).replace(/!\[([^\]]*)\]\((data:image\/(?:png|jpeg|gif);base64,[A-Za-z0-9+\/=]+)\)/g,'<img class="pv" alt="$1" src="$2">').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*]+)\*/g,'$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  const out=[];let list=null,tbl=null;const close=()=>{if(list){out.push('</'+list+'>');list=null}};
  const flush=()=>{if(!tbl)return;const rows=tbl.filter(l=>!/^\s*\|(\s*:?-+:?\s*\|)+\s*$/.test(l)).map(l=>l.trim().replace(/^\||\|$/g,'').split(/(?<!\\)\|/).map(c=>inl(c.trim().replace(/\\\|/g,'|'))));
    out.push('<div class="wrap"><table>'+rows.map((r,i)=>'<tr>'+r.map(c=>(i?'<td>':'<th>')+c+(i?'</td>':'</th>')).join('')+'</tr>').join('')+'</table></div>');tbl=null};
  for(const line of src.split('\n')){let m;if(/^\s*\|.*\|\s*$/.test(line)){close();(tbl=tbl||[]).push(line);continue}flush();
    if(m=line.match(/^\u0000(\d+)\u0000$/)){close();out.push('<pre><code>'+esc(blocks[m[1]])+'</code></pre>')}
    else if(m=line.match(/^(#{1,6})\s+(.*)/)){close();out.push(`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`)}
    else if(m=line.match(/^\s*[-*+]\s+(.*)/)){if(list!=='ul'){close();out.push('<ul>');list='ul'}out.push('<li>'+inl(m[1])+'</li>')}
    else if(m=line.match(/^\s*\d+\.\s+(.*)/)){if(list!=='ol'){close();out.push('<ol>');list='ol'}out.push('<li>'+inl(m[1])+'</li>')}
    else if(m=line.match(/^>\s?(.*)/)){close();out.push('<blockquote>'+inl(m[1])+'</blockquote>')}
    else if(/^\s*(---|\*\*\*)\s*$/.test(line)){close();out.push('<hr>')}
    else if(!line.trim())close();else{close();out.push('<p>'+inl(line)+'</p>')}}
  close();flush();return out.join('\n')}
function parseCsv(s,delim,lim=1001){const rows=[];let r=[],c='',q=false;
  for(let i=0;i<s.length;i++){const ch=s[i];
    if(q){if(ch==='"'){if(s[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;else if(ch===delim){r.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&s[i+1]==='\n')i++;r.push(c);rows.push(r);r=[];c='';if(rows.length>=lim)break}
    else c+=ch}
  if(c||r.length){r.push(c);rows.push(r)}return rows}
function vView(pane){
  const f=cur,k=f.kind;
  if(f.ed&&f.editing)return edView(pane);
  if(k==='image'){pane.innerHTML=`<img class="pv" src="${f.url}" alt="">`;pane.firstChild.onerror=()=>{pane.innerHTML='<p class="note err">This browser cannot display this image format. Try Chrome or Safari, or check the Hex and Info tabs.</p>'}}
  else if(k==='audio'){pane.innerHTML=`<audio controls src="${f.url}" style="width:100%"></audio>`;waveform(f,pane)}
  else if(k==='video')pane.innerHTML=`<video controls src="${f.url}"></video><p class="note">If it will not play, this browser may lack the codec.</p>`;
  else if(k==='pdf')pdfView(pane);
  else if(k==='json'){try{const j=JSON.parse(f.text);const t=Array.isArray(j)?`array, ${j.length} items`:j&&typeof j==='object'?`object, ${Object.keys(j).length} keys`:typeof j;
    pane.innerHTML=`<p class="note ok">Valid JSON (${t})</p><pre>${esc(JSON.stringify(j,null,2))}</pre>`}catch(e){pane.innerHTML=`<p class="note err">Invalid JSON: ${esc(e.message)}</p><pre>${esc(f.text.slice(0,20000))}</pre>`}}
  else if(k==='xml'){try{pane.innerHTML=`<p class="note ok">Well-formed XML</p><pre>${esc(fmtXml(f.text))}</pre>`}catch(e){pane.innerHTML=`<p class="note err">Invalid XML: ${esc(e.message)}</p><pre>${esc(f.text.slice(0,20000))}</pre>`}}
  else if(k==='md')pane.innerHTML=`<div class="md">${mdRender(f.text)}</div>`;
  else if(k==='csv'){const rows=csvRows(f,1001);pane.innerHTML='<p class="note">Showing up to 1000 rows.</p><div class="wrap"><table>'+rows.map((r,i)=>'<tr>'+r.map(c=>(i?'<td>':'<th>')+esc(c)+(i?'</td>':'</th>')).join('')+'</tr>').join('')+'</table></div>'}
  else if(k==='jks'){pane.innerHTML='<p class="note">Reading keystore structure…</p>';jksView(pane)}
  else if(k==='p12')p12View(pane);
  else if(k==='doc')pane.innerHTML='<div class="md">'+mdRender(f.doc.md)+'</div>';
  else if(k==='zip')zipView(pane);
  else if(k==='text')codeView(pane);
  else if(k==='rich')richView(pane);
}

/* ---------- PDF (pdf.js loaded from cdnjs on first use) ---------- */
let pdfjsP=null;
function loadPdfJs(){return pdfjsP||(pdfjsP=new Promise((ok,no)=>{
  const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';const sc=document.createElement('script');sc.src=base+'pdf.min.js';
  sc.onload=async()=>{try{const w=await (await fetch(base+'pdf.worker.min.js')).text();
    pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([w],{type:'text/javascript'}));ok(pdfjsLib)}catch(e){pdfjsP=null;no(e)}};
  sc.onerror=()=>{pdfjsP=null;no(new Error('offline'))};document.head.appendChild(sc)}))}
async function pdfView(pane){
  const f=cur;pane.innerHTML='<p class="note" id="pst">Loading PDF renderer…</p><div id="pgs"></div>';
  try{const lib=await loadPdfJs();const doc=await lib.getDocument({data:f.bytes.slice()}).promise;
    const box=$('#pgs'),st=$('#pst'),max=Math.min(doc.numPages,60),txt=[];
    for(let i=1;i<=max;i++){if(!box||!document.body.contains(box))return;
      st.textContent=`Rendering page ${i} of ${doc.numPages}…`;const pg=await doc.getPage(i);
      const w=(pane.clientWidth-26)||600,v0=pg.getViewport({scale:1}),vp=pg.getViewport({scale:Math.min(Math.max(w/v0.width,.5),3)*(window.devicePixelRatio||1)});
      const cv=document.createElement('canvas');cv.className='pg';cv.width=vp.width;cv.height=vp.height;box.appendChild(cv);
      await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
      try{const tc=await pg.getTextContent();txt.push('--- Page '+i+' ---\n'+tc.items.map(x=>x.str).join(' '));f.report=txt.join('\n\n')}catch(_){}}
    st.textContent=doc.numPages>max?`Showing the first ${max} of ${doc.numPages} pages.`:`${doc.numPages} page(s). Report .txt/.md exports the extracted text.`;
  }catch(e){
    pane.innerHTML=`<p class="note err">Built-in PDF renderer couldn't load (${esc(e.message)}). It needs internet once to fetch pdf.js. Trying the browser's own viewer:</p><iframe src="${f.url}" title="PDF preview"></iframe><p class="note"><a href="${f.url}" target="_blank" rel="noopener">Open in a new tab</a></p>`}
}

/* ---------- JKS ---------- */
async function sha(bytes,alg){const h=await crypto.subtle.digest(alg,bytes);return [...new Uint8Array(h)].map(hex2).join(':')}
function cn(der){const out=[];for(let i=0;i<der.length-6;i++){if(der[i]===0x55&&der[i+1]===4&&der[i+2]===3){const L=der[i+4];if(der[i+3]>=0x0c&&der[i+3]<=0x1e&&L<0x80&&i+5+L<=der.length){out.push(new TextDecoder().decode(der.subarray(i+5,i+5+L)))}}}return out}
async function jksView(pane){
  const f=cur,b=f.bytes,v=new DataView(b.buffer,b.byteOffset,b.byteLength);let p=0;
  const u32=()=>{const x=v.getUint32(p);p+=4;return x};
  const utf=()=>{const n=v.getUint16(p);p+=2;const s=new TextDecoder().decode(b.subarray(p,p+n));p+=n;return s};
  const entries=[];let note='',ver=0,n=0;
  try{u32();ver=u32();n=u32();
    for(let i=0;i<n;i++){const tag=u32(),alias=utf();const ts=Number(v.getBigUint64(p));p+=8;const e={alias,date:new Date(ts),certs:[]};
      if(tag===1){e.type='Private key + chain';const kl=u32();p+=kl;const cc=u32();
        for(let c=0;c<cc;c++){if(ver===2)utf();const l=u32();e.certs.push(b.slice(p,p+l));p+=l}}
      else if(tag===2){e.type='Trusted certificate';if(ver===2)utf();const l=u32();e.certs.push(b.slice(p,p+l));p+=l}
      else throw new Error('unknown entry tag '+tag);
      entries.push(e)}
  }catch(e){note='Stopped early: '+e.message}
  let rows='';const rep=[`JKS version ${ver}, ${n} entries`];
  for(const e of entries){const c=e.certs[0];let fp='';try{fp=c?await sha(c,'SHA-256'):''}catch(_){fp=''}
    const names=(c?cn(c):[]).slice(0,2).join(' / ')||'-',d=isNaN(e.date)?'-':e.date.toISOString().slice(0,10);
    rows+=`<tr><td>${esc(e.alias)}</td><td>${e.type}</td><td>${d}</td><td>${e.certs.length}</td><td>${esc(names)}</td><td class="mono">${esc(fp)}</td></tr>`;
    rep.push([e.alias,e.type,d,'chain '+e.certs.length,names,fp].join(' | '))}
  if(note)rep.push(note);f.report=rep.join('\n');

  <div class="wrap"><table><tr><th>Alias</th><th>Type</th><th>Created</th><th>Chain</th><th>CN (issuer / subject)</th><th>Cert SHA-256</th></tr>${rows}</table></div>`;
}

/* ---------- DER / PKCS#12 ---------- */
const PBES2='1.2.840.113549.1.5.13';
const OIDN={'1.2.840.113549.1.12.1.3':'3DES-CBC (legacy)','1.2.840.113549.1.12.1.6':'RC2-40-CBC (legacy)',[PBES2]:'PBES2 (PBKDF2 + AES)','1.2.840.113549.1.12.10.1.1':'Private key (plain)','1.2.840.113549.1.12.10.1.2':'Private key (encrypted)','1.2.840.113549.1.12.10.1.3':'Certificate','1.2.840.113549.1.12.10.1.5':'Secret key','1.3.14.3.2.26':'SHA-1','2.16.840.1.101.3.4.2.1':'SHA-256','2.16.840.1.101.3.4.2.3':'SHA-512'};
function der(b,p){const tag=b[p];let l=b[p+1],o=2;if(l===0x80)throw new Error('BER indefinite length');
  if(l&0x80){const n=l&0x7f;l=0;for(let i=0;i<n;i++)l=l*256+b[p+2+i];o=2+n}
  if(!(p+o+l<=b.length))throw new Error('bad length');return {tag,s:p+o,e:p+o+l,p}}
function kids(b,n){const o=[];let p=n.s;while(p<n.e){const k=der(b,p);o.push(k);p=k.e}return o}
function oid(b,n){const r=b.subarray(n.s,n.e),a=[Math.floor(r[0]/40),r[0]%40];let v=0;for(let i=1;i<r.length;i++){v=v*128+(r[i]&127);if(!(r[i]&128)){a.push(v);v=0}}return a.join('.')}
function isPfx(b){try{if(b[0]!==0x30)return false;const k=kids(b,der(b,0));return k.length>=2&&k[0].tag===2&&k[1].tag===0x30&&oid(b,kids(b,k[1])[0])==='1.2.840.113549.1.7.1'}catch(_){return false}}
function bagsOf(b,seq,out){
  for(const bag of kids(b,seq)){const k=kids(b,bag),id=oid(b,k[0]),e={name:OIDN[id]||id,alias:'',cert:null,keyLen:0,alg:''},val=kids(b,k[1])[0];
    if(id.endsWith('.10.1.3')){const c=kids(b,val);const o=kids(b,c[1])[0];e.cert=b.slice(o.s,o.e)}
    else if(id.endsWith('.10.1.2')){const c=kids(b,val);e.alg=oid(b,kids(b,c[0])[0]);e.keyLen=c[1].e-c[1].s}
    if(k[2])for(const a of kids(b,k[2])){const ak=kids(b,a);if(oid(b,ak[0])==='1.2.840.113549.1.9.20'){const x=kids(b,ak[1])[0];e.alias=new TextDecoder('utf-16be').decode(b.subarray(x.s,x.e))}}
    out.push(e)}}
function p12Parse(b){const k=kids(b,der(b,0)),int=n=>{let v=0;for(let i=n.s;i<n.e;i++)v=v*256+b[i];return v};
  const r={ver:int(k[0]),safes:[],mac:null},oc=kids(b,kids(b,k[1])[1])[0];
  for(const ci of kids(b,der(b,oc.s))){const c=kids(b,ci),t=oid(b,c[0]),body=kids(b,c[1])[0];
    if(t==='1.2.840.113549.1.7.1'){const s={bags:[]};bagsOf(b,der(b,body.s),s.bags);r.safes.push(s)}
    else if(t==='1.2.840.113549.1.7.6'){const ek=kids(b,kids(b,body)[1]);r.safes.push({algNode:ek[1],alg:oid(b,kids(b,ek[1])[0]),cipher:b.subarray(ek[2].s,ek[2].e)})}}
  if(k[2]){const m=kids(b,k[2]);r.mac={alg:OIDN[oid(b,kids(b,kids(b,m[0])[0])[0])]||'?',iter:m[2]?int(m[2]):1}}
  return r}
async function pbes2(b,algNode,cipher,pw){
  const [kdf,enc]=kids(b,kids(b,algNode)[1]),kp=kids(b,kids(b,kdf)[1]),salt=b.slice(kp[0].s,kp[0].e);let iter=0,prf='SHA-1';
  for(let i=kp[1].s;i<kp[1].e;i++)iter=iter*256+b[i];
  for(const x of kp.slice(2))if(x.tag===0x30)prf={'1.2.840.113549.2.7':'SHA-1','1.2.840.113549.2.9':'SHA-256','1.2.840.113549.2.10':'SHA-384','1.2.840.113549.2.11':'SHA-512'}[oid(b,kids(b,x)[0])]||prf;
  const ek=kids(b,enc),len={'2.16.840.1.101.3.4.1.2':16,'2.16.840.1.101.3.4.1.22':24,'2.16.840.1.101.3.4.1.42':32}[oid(b,ek[0])];
  if(!len)throw new Error('unsupported cipher');
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:prf},base,{name:'AES-CBC',length:len*8},false,['decrypt']);
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-CBC',iv:b.slice(ek[1].s,ek[1].e)},key,cipher))}
async function p12View(pane){
  const f=cur,b=f.bytes;let r;
  try{r=p12Parse(b)}catch(e){pane.innerHTML=`<p class="note err">Could not read this PKCS#12 structure: ${esc(e.message)}. Check the Hex tab.</p>`;return}
  pane.innerHTML=`<p class="note">PKCS#12 keystore (Android Studio and modern keytool save these even with a .jks name). Aliases and key sizes show without a password; enter it to unlock encrypted certificates. Nothing leaves your device.</p>
  <div class="bar"><input id="pw" type="password" placeholder="Store password" autocomplete="off" style="padding:7px;border:1px solid var(--line);border-radius:6px;background:var(--code);color:var(--ink)"><button class="pri" id="unl">Unlock</button><span class="st" id="ust"></span></div><div id="p12out"></div>`;
  async function show(){
    const rows=[],rep=[`PKCS#12 keystore, version ${r.ver}`,r.mac?`MAC: ${r.mac.alg}, ${r.mac.iter} iterations`:'No MAC'];let legacy=false;

      if(!s.bags){if(s.alg!==PBES2)legacy=true;rows.push(['(locked container)','Encrypted','','',OIDN[s.alg]||s.alg]);rep.push('Locked container: '+(OIDN[s.alg]||s.alg));continue}

        rows.push([e.alias||'(no alias)',e.name+(e.keyLen?` (${e.keyLen} bytes)`:''),names,fp,e.alg?(OIDN[e.alg]||e.alg):'']);rep.push(rows[rows.length-1].join(' | '))}}
    f.report=rep.join('\n');

/* ---------- Hex ---------- */
const PAGE=4096;

  const inp=document.createElement('input');inp.type='number';inp.min=0;inp.placeholder='Offset';inp.setAttribute('aria-label','Jump to offset (decimal)');
  inp.onchange=()=>{f.hexOff=Math.max(0,Math.min(+inp.value||0,b.length-1));draw()};st.before(inp);
  st.textContent=`Offset ${f.hexOff}–${Math.min(f.hexOff+PAGE,b.length)} of ${b.length}`;
  let out='';
  for(let o=f.hexOff;o<Math.min(f.hexOff+PAGE,b.length);o+=16){const r=b.subarray(o,Math.min(o+16,b.length));
    let h='',a='';for(let i=0;i<16;i++){h+=(i<r.length?hex2(r[i]):'  ')+(i===7?'  ':' ');if(i<r.length)a+=r[i]>=32&&r[i]<127?String.fromCharCode(r[i]):'.'}
    out+=o.toString(16).padStart(8,'0')+'  '+h+' |'+esc(a)+'|\n'}

function stringsOf(b,max){const out=[];let s='',st=0;
  for(let i=0;i<=b.length&&out.length<max;i++){const c=b[i];
    if(c>=32&&c<127||c===9){if(!s)st=i;s+=String.fromCharCode(c)}
    else{if(s.length>=4)out.push(st.toString(16).padStart(8,'0')+'  '+s);s=''}}return out}
function strings16(b,max){const o=[];for(const start of [0,1]){let cur='',st=0;for(let i=start;i+1<b.length&&o.length<max*2;i+=2){const c=b[i]|(b[i+1]<<8);if((c>=32&&c<127)||c===9){if(!cur)st=i;cur+=String.fromCharCode(c)}else{if(cur.length>=4)o.push([st,cur]);cur=''}}}
