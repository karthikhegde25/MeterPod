name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Handles two cases automatically:
      # 1. You uploaded a zip directly to the repo (unextracted) - this
      #    unzips it first.
      # 2. The project files are already sitting in the repo somewhere
      #    (root or a subfolder).
      # Either way, it finds settings.gradle and points later steps at it.
      - name: Locate Gradle project (auto-extract zip if present)
        run: |
          set -e
          if ls ./*.zip >/dev/null 2>&1 && [ ! -f settings.gradle ]; then
            for z in ./*.zip; do
              echo "Extracting $z ..."
              unzip -o "$z" -d _extracted
            done
          fi

          PROJECT_PATH=$(find . -maxdepth 5 -name "settings.gradle" \
            -not -path "*/.git/*" | head -n1 | xargs -r dirname)

          if [ -z "$PROJECT_PATH" ]; then
            echo "::error::Could not find settings.gradle anywhere in the repo."
            exit 1
          fi

          echo "Found project at: $PROJECT_PATH"
          echo "PROJECT_DIR=$PROJECT_PATH" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK (runner's pre-installed SDK, direct sdkmanager)
        run: |
          set -e
          ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -r | head -n1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Could not find sdkmanager under $ANDROID_SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "Using sdkmanager at: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      # Decodes the base64 keystore secret to a temp file that never gets
      # committed or uploaded anywhere, and points the env vars app/build.gradle
      # reads at it. Requires four repo secrets:
      #   ANDROID_KEYSTORE           - base64 of the .jks/.keystore file
      #   ANDROID_KEYSTORE_PASSWORD  - store password
      #   ANDROID_KEY_ALIAS          - the key's alias inside the keystore
      #   ANDROID_KEY_PASSWORD       - that key's own password
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          set -e
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE secret is empty or missing. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
